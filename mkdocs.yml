site_name: ShapleyX Documentation
site_url: https://frbennett.github.io/shapleyx/
repo_url: https://github.com/frbennett/shapleyx

theme:
  name: readthedocs
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter:
     ignore_h1_titles: False
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            heading_level: 3
            merge_init_into_class: true

nav:
  - Home: index.md
  - User Guide: user-guide.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Deployment: getting-started/deployment.md
  - Tutorials:
    - Basic Usage: tutorials/basic-usage.md
    - Example Workflow: tutorials/owen_product_function.ipynb
    - Cantilever Beam: tutorials/cantilever_beam.ipynb
    - Copula Samplers: tutorials/cantilever_beam_copulas.ipynb
    - MC Shapley: tutorials/mc_shapley.ipynb
    - MC Shapley + Sobol: tutorials/mc_shapley_sobol.ipynb
    - Coalition Truncation: tutorials/mc_shapley_kmax.ipynb
    - Truncated Normal: tutorials/mc_shapley_truncated_normal.ipynb
    - Correlated Ishigami: tutorials/iooss_prieur_ishigami_correlation.ipynb
    - Wing Weight: tutorials/wing_weight.ipynb
    - Fire Spread: tutorials/fire_spread.ipynb
    - Sobol G50: tutorials/sobolG_function.ipynb
    - SAC-SMA: tutorials/sac_sma_shapleyx_example.ipynb
    - SAC-SMA Owen Effects: tutorials/sac_sma_owen_effects.ipynb
  - How-to Guides:
    - Common Tasks: how-to-guides/common-tasks.md
    - MC Shapley: how-to-guides/mc-shapley.md
  - Reference:
    - API: reference/api.md
    - ARD: reference/ard.md
    - MC Shapley: reference/mc_shapley.md
    - Streaming OMP: reference/streaming-omp.md
  - Explanation:
    - Theory: explanation/theory.md
    - Value Function v(S): explanation/value-function.md
    - RS-HDMR Construction: explanation/rs_hdmr.md
    - Distribution Classes: explanation/distributions.md
    - Arbitrary Marginals: explanation/arbitrary-marginals.md
    - Owen (Grouped) Effects: explanation/owen-effects.md
    - Case Studies: explanation/case_studies.md
    - ARD Theory: explanation/ard_theory.md
    - Streaming Basis Expansion: explanation/streaming-omp.md
    - Moment-Free Measures: explanation/moment-free.md
    - Performance: explanation/performance.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji
  - pymdownx.tabbed
  - pymdownx.snippets
  - attr_list
  - pymdownx.arithmatex:
      generic: true


extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML